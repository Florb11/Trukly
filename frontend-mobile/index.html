<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#087f8c" />
    <meta name="description" content="Aplicación mobile de Trukly para choferes." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Trukly Mobile</title>
    <script>
      let tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      try {
        const guardado = localStorage.getItem("trukly_mobile_theme");
        if (guardado === "light" || guardado === "dark") tema = guardado;
      } catch {}
      document.documentElement.dataset.theme = tema;
      document.querySelector('meta[name="theme-color"]').content = tema === "dark" ? "#101722" : "#f4f7fb";
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
